name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (go.mod) plus the two most recent releases, so a
        # customer on any of them gets a build we actually verified.
        go: ["1.21", "1.22", "1.23"]
        os: [ubuntu-latest, macos-latest]
        # Go <=1.22 is EOL and predates current macOS: its cgo-linked binaries
        # (any package importing net, and -race which forces cgo) come out of
        # the linker without LC_UUID and dyld aborts them on macos-latest.
        # Those Go versions keep full gofmt/vet/build/race coverage on ubuntu.
        exclude:
          - os: macos-latest
            go: "1.21"
          - os: macos-latest
            go: "1.22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race catches the lifecycle bugs that matter most in this SDK: the
      # recognizer hands callbacks to an internal reader thread while the
      # caller writes audio and may stop concurrently.
      - name: Test
        run: go test -race -count=1 ./...
